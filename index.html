<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>학교 분실물 센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/style.css" />
<!-- 일반 <script> 태그(모듈 아님)로 쓰기 위해 compat 버전 SDK를 사용함.
     이렇게 하면 로컬 서버 없이 파일을 더블클릭해서 열어도 동작함. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">

  <header class="site-header">
    <h1 class="wordmark">학교 분실물 센터</h1>
    <nav class="tabs">
      <button type="button" class="tab-btn active" data-tab="list">분실물 목록</button>
      <button type="button" class="tab-btn" data-tab="register">습득 등록</button>
      <button type="button" class="tab-btn" data-tab="admin">관리자</button>
    </nav>
  </header>

  <main>

    <!-- 분실물 목록 -->
    <section id="tab-list" class="tab-panel active">
      <div class="filter-bar">
        <input id="search-input" type="text" placeholder="물건 이름이나 습득 장소로 검색" />
        <select id="category-filter">
          <option value="">전체 카테고리</option>
          <option value="전자기기">전자기기</option>
          <option value="지갑/카드">지갑/카드</option>
          <option value="의류">의류</option>
          <option value="학용품">학용품</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div id="item-grid" class="item-grid"></div>
    </section>

    <!-- 습득 등록 -->
    <section id="tab-register" class="tab-panel">
      <h2>분실물 습득 등록</h2>
      <p class="hint">사진에 드러나지 않는 특징을 2개 이상 적어주시면, 나중에 실제 주인을 확인하는 데 쓰입니다. 이 정보는 관리자에게만 공개됩니다.</p>
      <form id="register-form" class="form-card">
        <label>물건 이름
          <input name="title" required placeholder="예: 검은색 에어팟 케이스" />
        </label>
        <label>카테고리
          <select name="category" required>
            <option value="전자기기">전자기기</option>
            <option value="지갑/카드">지갑/카드</option>
            <option value="의류">의류</option>
            <option value="학용품">학용품</option>
            <option value="기타">기타</option>
          </select>
        </label>
        <label>습득 장소
          <input name="place" required placeholder="예: 본관 2층 급식실 앞" />
        </label>
        <label>습득 일시
          <input name="foundAt" type="datetime-local" required />
        </label>
        <label>사진
          <input name="photo" type="file" accept="image/*" required />
        </label>
        <label>공개 특징 (모두에게 보임)
          <textarea name="publicNote" placeholder="예: 검은색, 애플 로고 스티커 부착"></textarea>
        </label>

        <div class="private-feature-section">
          <p class="field-label">비공개 특징 (관리자만 확인 — 최소 2개)</p>
          <div id="private-feature-list">
            <input type="text" name="privateFeature" placeholder="예: 케이스 안쪽에 이름 스티커가 있음" />
            <input type="text" name="privateFeature" placeholder="예: 충전 단자 옆에 작은 흠집이 있음" />
          </div>
          <button type="button" id="add-private-feature" class="ghost-btn small">특징 추가</button>
        </div>

        <button type="submit" class="primary-btn">등록하기</button>
      </form>
    </section>

    <!-- 관리자 -->
    <section id="tab-admin" class="tab-panel">
      <div id="admin-login">
        <h2>관리자 로그인</h2>
        <form id="admin-login-form" class="form-card narrow">
          <label>이메일<input name="email" type="email" required /></label>
          <label>비밀번호<input name="password" type="password" required /></label>
          <button type="submit" class="primary-btn">로그인</button>
        </form>
      </div>

      <div id="admin-dashboard" hidden>
        <div class="admin-header">
          <h2>관리자 대시보드</h2>
          <button type="button" id="admin-logout" class="ghost-btn small">로그아웃</button>
        </div>
        <p class="hint">습득자가 등록한 비공개 특징과 신고자가 제출한 정보를 대조한 뒤 승인해 주세요.</p>
        <div id="admin-item-list"></div>
      </div>
    </section>

  </main>

  <!-- 분실물 상세 모달 -->
  <div id="item-modal" class="modal" hidden>
    <div class="modal-content">
      <button type="button" class="modal-close">&times;</button>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- 신고 모달 -->
  <div id="claim-modal" class="modal" hidden>
    <div class="modal-content">
      <button type="button" class="modal-close">&times;</button>
      <div class="modal-body"></div>
    </div>
  </div>

</div>

<script src="js/firebase-config.js"></script>
<script src="js/fsm.js"></script>
<script src="js/student.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
